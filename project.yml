name: TNEFQuickLook
options:
  bundleIdPrefix: io.github.lhaeger
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TNEFKit:
    path: TNEFKit
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  TNEFPreview:
    type: application
    platform: macOS
    sources: [TNEFPreview]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lhaeger.TNEFPreview
    dependencies:
      - target: TNEFPreviewExtension
    info:
      path: TNEFPreview/Info.plist
      properties:
        CFBundleDisplayName: TNEF Preview
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    entitlements:
      path: TNEFPreview/TNEFPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
  TNEFPreviewExtension:
    type: app-extension
    platform: macOS
    sources: [TNEFPreviewExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lhaeger.TNEFPreview.QuickLook
    dependencies:
      - package: TNEFKit
        product: TNEFKit
      - package: TNEFKit
        product: TNEFRender
    info:
      path: TNEFPreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: TNEF Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            # com.microsoft.tnef is the system type. Letter Opener declares its own type
            # for .dat / application/ms-tnef; while it is installed (or still registered
            # from the Trash) macOS may assign that one instead.
            QLSupportedContentTypes:
              - com.microsoft.tnef
              - com.creativeinaustria.letteropener.winmail
    entitlements:
      path: TNEFPreviewExtension/TNEFPreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
